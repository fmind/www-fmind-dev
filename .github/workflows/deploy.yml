name: CI/CD Pipeline
on:
  push:
    branches: [main, "ci/gha-caching-test"]
    paths:
      - ".github/workflows/deploy.yml"
      - "Dockerfile"
      - "app/**"
      - "justfile"
      - "pyproject.toml"
      - "static/**"
      - "uv.lock"
  workflow_dispatch:
env:
  PROJECT_ID: www-fmind-dev
  REGION: us-central1
  REPOSITORY: app
  SERVICE_NAME: www-fmind-dev
  AR_HOSTNAME: us-central1-docker.pkg.dev
  WORKLOAD_IDENTITY_PROVIDER: "projects/997496187785/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider"
  SERVICE_ACCOUNT: "github-actions@www-fmind-dev.iam.gserviceaccount.com"
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - name: Docker Auth
        uses: docker/login-action@v4
        with:
          registry: ${{ env.AR_HOSTNAME }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.AR_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
            ${{ env.AR_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.AR_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
