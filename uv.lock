    { name = "fastapi", specifier = ">=0.136.3" },
    { name = "granian", specifier = ">=2.7.5" },
    { name = "httpx", specifier = ">=0.28.1" },
    { name = "pydantic", specifier = ">=2.13.4" },
    { name = "pydantic-settings", specifier = ">=2.14.1" },
    { name = "python-fasthtml", specifier = ">=0.14.2" },
